<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Se mudó &middot; aurum-board</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://tableros.yodesarrollo.mx/aurum-board/">
<meta http-equiv="refresh" content="1;url=https://tableros.yodesarrollo.mx/aurum-board/">
<script>
// Reenvío conservando ruta profunda, query y fragmento.
// /aurum-board/                  -> https://tableros.yodesarrollo.mx/aurum-board/
// /aurum-board/guia.html         -> https://tableros.yodesarrollo.mx/aurum-board/guia.html
// /aurum-board/sub/pagina.html#x -> https://tableros.yodesarrollo.mx/aurum-board/sub/pagina.html#x
// /aurum-board?a=1               -> https://tableros.yodesarrollo.mx/aurum-board/?a=1
window.YOD_DESTINO = function(pathname, search, hash){
  var BASE = "https://tableros.yodesarrollo.mx/aurum-board";
  var REPO = "aurum-board";
  var p = pathname || "/";
  var pre = "/" + REPO;
  var resto = "";
  if (p === pre || p === pre + "/") {
    resto = "";
  } else if (p.indexOf(pre + "/") === 0) {
    resto = p.slice(pre.length + 1);
  } else {
    // Prefijo inesperado: manda a la raíz del tablero.
    resto = "";
  }
  // Candado: el destino nunca puede salirse de /aurum-board/.
  // 1) barras sobrantes al inicio del resto (evita rutas tipo //algo).
  resto = resto.replace(/^\/+/, "");
  // 2) segmentos "." o ".." (crudos o percent-encoded): se descarta la ruta.
  var seg = resto.split("/");
  for (var i = 0; i < seg.length; i++) {
    var s = seg[i].toLowerCase().replace(/%2e/g, ".");
    if (s === "." || s === "..") { resto = ""; break; }
  }
  return BASE + "/" + resto + (search || "") + (hash || "");
};
(function(){
  try {
    location.replace(window.YOD_DESTINO(location.pathname, location.search, location.hash));
  } catch (e) {
    location.replace("https://tableros.yodesarrollo.mx/aurum-board/");
  }
})();
</script>
<style>
  :root{
    --ypaper:#f6f3ed; --ycard:#fff; --ytext:#231d14; --yink:#17140f;
    --ymuted:#5f594e; --yline:#e1dacb; --yg:#9a7b3f; --yg-hi:#b07c2e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ypaper:#0a0a0c; --ycard:#16161a; --ytext:#ece7db; --yink:#f4f1ea;
      --ymuted:#8a8780; --yline:rgba(255,255,255,.10); --yg:#c9a227; --yg-hi:#e0b950;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--ypaper); color:var(--ytext);
    font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:460px}
  .marca{font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--yg); font-weight:600; margin:0 0 18px}
  h1{font-family:'Instrument Serif',Georgia,'Times New Roman',serif; font-weight:400;
    font-size:clamp(30px,6vw,42px); line-height:1.1; letter-spacing:-.01em;
    margin:0 0 12px; color:var(--yink)}
  h1 em{font-style:italic; color:var(--yg-hi)}
  p{margin:0 0 24px; color:var(--ymuted); font-size:15px; line-height:1.6}
  a.btn{display:inline-block; text-decoration:none; padding:12px 20px;
    border-radius:10px; font-size:15px; font-weight:500;
    background:var(--yg); border:1px solid var(--yg); color:#fff}
  @media (prefers-color-scheme: dark){ a.btn{color:#0a0a0c} }
  a.btn:hover{background:var(--yg-hi); border-color:var(--yg-hi)}
</style>
</head>
<body>
<main>
  <p class="marca">Yo Desarrollo</p>
  <h1>Esta dirección <em>se mudó</em>.</h1>
  <p>Te estamos llevando a la nueva casa de los tableros. Si no avanza sola, usa el botón.</p>
  <p><a class="btn" id="ir" href="https://tableros.yodesarrollo.mx/aurum-board/">Continuar &rarr;</a></p>
</main>
<script>
(function(){
  var a = document.getElementById("ir");
  if (a) a.href = window.YOD_DESTINO(location.pathname, location.search, location.hash);
})();
</script>
</body>
</html>
